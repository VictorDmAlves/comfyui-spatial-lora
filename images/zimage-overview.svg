  <text x="41" y="76" font-family="Arial,sans-serif" font-size="12" fill="#aabbd1">Z-Image Turbo (native)</text>
  <circle cx="241" cy="69" r="5" fill="#bb9cfa"/>
  <rect x="29" y="147" width="213" height="71" rx="10" fill="#222a35" stroke="#516175"/>
  <text x="43" y="173" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#e9f1fa">Empty Latent Size Picker</text>
  <text x="43" y="196" font-family="Arial,sans-serif" font-size="12" fill="#aabbd1">LATENT + width / height</text>
  <rect x="349" y="30" width="271" height="188" rx="10" fill="#243046" stroke="#69a7ff" stroke-width="1.5"/>
  <text x="366" y="54" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f3f7ff">Spatial LoRA | Multi LoRA</text>
  <text x="366" y="79" font-family="Arial,sans-serif" font-size="12" fill="#a7caff">Backend: auto (Z-Image NextDiT)</text>
  <rect x="365" y="99" width="238" height="29" rx="5" fill="#35506f"/>
