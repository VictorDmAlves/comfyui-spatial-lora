<svg xmlns="http://www.w3.org/2000/svg" width="960" height="244" viewBox="0 0 960 244" role="img" aria-labelledby="title desc">
  <title id="title">Spatial LoRA on Z-Image: compact node graph</title>
  <desc id="desc">Load Diffusion Model feeds Spatial LoRA Multi LoRA, which feeds the KSampler. A latent size picker connects width and height to the Spatial LoRA node and latent to the sampler.</desc>
  <rect width="960" height="244" rx="13" fill="#141920"/>
  <path d="M246 69 H336 Q341 69 341 74 V81 H349" fill="none" stroke="#bb9cfa" stroke-width="3"/>
  <path d="M620 80 H673 Q681 80 681 88 V111 H730" fill="none" stroke="#bb9cfa" stroke-width="3"/>
  <path d="M242 175 H281 Q295 175 295 159 V192 H349" fill="none" stroke="#86d8a2" stroke-width="2.5"/>
  <path d="M242 190 H303 Q314 190 314 176 V207 H349" fill="none" stroke="#86d8a2" stroke-width="2.5"/>
  <path d="M242 208 H692 Q704 208 704 194 V159 H730" fill="none" stroke="#ffb68d" stroke-width="2.5"/>
